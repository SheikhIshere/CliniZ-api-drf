components:
  schemas:
    ActivatingAccount:
      type: object
      properties:
        otp:
          type: string
      required:
      - otp
    AppointmentImage:
      type: object
      properties:
        image:
          type: string
          format: uri
      required:
      - image
    AppointmentTypeEnum:
      enum:
      - online
      - offline
      type: string
      description: |-
        * `online` - Online
        * `offline` - Offline
    AvailableTime:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 1000
      required:
      - created_at
      - id
      - updated_at
    BecomeDoctor:
      type: object
      properties:
        registration_number:
          type: string
          maxLength: 100
        certificate_img:
          type: string
          format: uri
        institution:
          type: string
          maxLength: 200
        degree:
          type: string
          maxLength: 100
        certificate_registration_number:
          type: string
          maxLength: 100
        year:
          type: string
          format: date
      required:
      - certificate_img
      - certificate_registration_number
      - degree
      - institution
      - registration_number
      - year
    BlankEnum:
      enum:
      - ''
    BugTypeEnum:
      enum:
      - UI/UX
      - Functional
      - Performance
      - Security
      - Compatibility
      - Accessibility
      - Network
      - Database
      - Integration
      - Other
      type: string
      description: |-
        * `UI/UX` - User Interface
        * `Functional` - Functional
        * `Performance` - Performance
        * `Security` - Security
        * `Compatibility` - Compatibility
        * `Accessibility` - Accessibility
        * `Network` - Network
        * `Database` - Database
        * `Integration` - Integration
        * `Other` - Other
    ContactUs:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        email:
          type: string
          nullable: true
          maxLength: 30
        problem:
          type: string
          nullable: true
        user:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - problem
      - updated_at
    Designation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 1000
      required:
      - created_at
      - id
      - updated_at
    Doctor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        birthday:
          type: string
          format: date
          nullable: true
        gender:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        age:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        blood_group:
          type: string
          maxLength: 5
        height:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
          description: height in inches
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,4})?$
          nullable: true
          description: weight in kg
        phone_number:
          type: string
          maxLength: 15
        address:
          type: string
        token:
          type: integer
          readOnly: true
          nullable: true
        photo:
          type: string
          format: uri
          nullable: true
        fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        year_of_experience:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        registration_number:
          type: string
          readOnly: true
          nullable: true
        is_verified:
          type: boolean
          readOnly: true
        verification_status:
          readOnly: true
          nullable: true
          description: |-
            Verification status of the doctor, maintained by admin

            * `pending` - Pending
            * `verified` - Verified
            * `rejected` - Rejected
          oneOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        personal_status:
          nullable: true
          description: |-
            Personal status of the doctor

            * `active` - Active
            * `inactive` - Inactive
            * `on_leave` - On Leave
          oneOf:
          - $ref: '#/components/schemas/PersonalStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        designation:
          type: array
          items:
            type: integer
        specialization:
          type: array
          items:
            type: integer
        available_time:
          type: array
          items:
            type: integer
      required:
      - created_at
      - email
      - id
      - is_verified
      - registration_number
      - role
      - token
      - updated_at
      - verification_status
    DoctorAppointmentList:
      type: object
      properties:
        patient_photo:
          type: string
          format: uri
          readOnly: true
        patient_name:
          type: string
          readOnly: true
        meeting_date:
          type: string
          format: date
