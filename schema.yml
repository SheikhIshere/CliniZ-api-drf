openapi: 3.0.3
info:
  title: Clinic-z Api Documentation
  version: 1.0.0
  description: A public API for all front-end developers across the globe to integrate
    with Clinic-z services. This API provides endpoints for user authentication, patient
    management, appointment scheduling, and medical record access.
paths:
  /v2/api/appointment/doctor/:
    get:
      operationId: appointment_doctor_list
      description: "\n    A doctor can see the appointments they have,\n    view patient
        details, and update appointment status.\n    "
      tags:
      - Appointment
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorAppointmentList'
          description: ''
    post:
      operationId: appointment_doctor_create
      description: "\n    A doctor can see the appointments they have,\n    view patient
        details, and update appointment status.\n    "
      tags:
      - Appointment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorAppointmentList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoctorAppointmentList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DoctorAppointmentList'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAppointmentList'
          description: ''
  /v2/api/appointment/doctor/{id}/update_status/:
    patch:
      operationId: appointment_doctor_update_status_partial_update
      description: "\n    A doctor can see the appointments they have,\n    view patient
        details, and update appointment status.\n    "
      parameters:
      - in: path
        name: id
